name: Test Install

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install from this checkout (not GitHub main) so PRs test their own code.
      - name: Run installer
        run: |
          git checkout -B ci-under-test
          DOTFILES_REPO="$GITHUB_WORKSPACE" DOTFILES_BRANCH=ci-under-test .bin/install.sh

      - name: Run installer again (must be idempotent)
        run: .bin/install.sh

      - name: Verify
        run: |
          set -e
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$HOME/go/bin:$PATH"
          test -f ~/ohmyzsh/oh-my-zsh.sh
          test -L ~/.vim/core.vim
          test -L ~/.config/nvim/init.lua
          test -f ~/.vim/autoload/plug.vim
          for t in uv rustup ruff gopls prettier; do command -v "$t"; done
          bash -ic 'type dotfiles'
          vim -es -u ~/.vimrc -i NONE -c 'if exists(":PlugInstall") | qa | else | cq | endif'
