name: teledildo

on:
  push:
    branches: [main]
    paths: ["projects/teledildo/**", ".github/workflows/teledildo.yml"]
  pull_request:
    paths: ["projects/teledildo/**", ".github/workflows/teledildo.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt, clippy, tests, proptests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/teledildo/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: projects/teledildo/core
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --example replay -- 250 < /dev/null

  firmware:
    name: firmware (clippy, build thumbv6m-none-eabi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/teledildo/firmware
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: projects/teledildo/firmware
      - run: cargo fmt --check
      - run: cargo clippy --locked --release -- -D warnings
      - run: cargo build --locked --release
      - run: size -A target/thumbv6m-none-eabi/release/teledildo-rp2040

  kani:
    name: core (Kani bounded proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # v1
        with:
          working-directory: projects/teledildo/core
