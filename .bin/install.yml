---
# User-level tooling. Never needs sudo (see system.yml for that). Idempotent.
#
#   uvx --from ansible ansible-playbook ~/.bin/install.yml [--tags rust,vim]
#
# Opt-in extras: -e install_pdm=true  -e install_nats_tools=true
#                -e update_rustup=true
- name: Install user tooling and editor setup
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  vars:
    home_dir: "{{ lookup('env', 'HOME') }}"
    go_min_minor: 21
  environment:
    # Tools installed by earlier tasks must be visible to later ones.
    PATH: "{{ home_dir }}/.local/bin:{{ home_dir }}/.cargo/bin:{{ home_dir }}/go/bin:{{ lookup('env', 'PATH') }}"
    GOTOOLCHAIN: auto

  tasks:
    # ---------------------------------------------------------------- probes
    - name: Probe available toolchains  # noqa: command-instead-of-shell (command -v is a builtin)
      ansible.builtin.shell: "command -v {{ item }}"
      loop: [go, npm, vim, nvim]
      register: probe
      changed_when: false
      failed_when: false
      tags: always

    - name: Record which toolchains exist
      ansible.builtin.set_fact:
        have: "{{ have | default({}) | combine({item.item: item.rc == 0}) }}"
      loop: "{{ probe.results }}"
      loop_control:
        label: "{{ item.item }}"
      tags: always

    # `go version` prints e.g. "go version go1.22.3 linux/amd64".
    - name: Read Go version
      ansible.builtin.shell: set -o pipefail && go version | awk '{print $3}' | sed 's/^go//'
      args:
        executable: /bin/bash
      register: go_version
      changed_when: false
      when: have.go
      tags: always

    # @latest Go tools need go >= 1.21; older toolchains cannot even parse
    # their go.mod. Compare as integers ("1.9" < "1.21").
    - name: Decide whether Go can build the editor tools
      ansible.builtin.set_fact:
        go_ok: "{{ v[0] | int > 1 or (v[0] | int == 1 and v[1] | int >= go_min_minor) }}"
      vars:
        v: "{{ (go_version.stdout | default('0.0')).split('.') + ['0'] }}"
      tags: always

    # ------------------------------------------------------------------ rust
    - name: Install rustup
      ansible.builtin.shell: set -o pipefail && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        executable: /bin/bash
        creates: "{{ home_dir }}/.cargo/bin/rustup"
      tags: rust

    - name: Update rustup toolchains
      ansible.builtin.command: rustup update
      changed_when: true
      when: update_rustup | default(false) | bool
      tags: rust

    - name: Install Rust components (rustfmt, rust-analyzer, clippy)
      ansible.builtin.command: rustup component add rustfmt rust-analyzer clippy
      register: rustup_components
      changed_when: "'installing component' in rustup_components.stderr + rustup_components.stdout"
      tags: [rust, ale]

    - name: Install stylua (Lua formatter)
      community.general.cargo:
        name: stylua
        state: present
      tags: [rust, ale]

    # ---------------------------------------------------------------- python
    # uv is guaranteed: install.sh installs it before running this playbook.
    - name: Install Python CLI tools (uv tool)
      ansible.builtin.command: uv tool install {{ item.pkg }}
      args:
        creates: "{{ home_dir }}/.local/bin/{{ item.bin }}"
      loop:
        - { pkg: ruff, bin: ruff }
        - { pkg: black, bin: black }
        - { pkg: isort, bin: isort }
        - { pkg: flake8, bin: flake8 }
        - { pkg: yamllint, bin: yamllint }
        - { pkg: vim-vint, bin: vint }
      tags: [python, ale]

    - name: Install pdm (uv tool)
      ansible.builtin.command: uv tool install pdm
      args:
        creates: "{{ home_dir }}/.local/bin/pdm"
      when: install_pdm | default(false) | bool
      tags: python

    # -------------------------------------------------------------------- go
    - name: Install Go editor tools
      ansible.builtin.command: go install {{ item.pkg }}
      args:
        creates: "{{ home_dir }}/go/bin/{{ item.bin }}"
      loop:
        - { pkg: "golang.org/x/tools/gopls@latest", bin: gopls }
        - { pkg: "golang.org/x/tools/cmd/goimports@latest", bin: goimports }
        - { pkg: "github.com/golangci/golangci-lint/cmd/golangci-lint@latest", bin: golangci-lint }
        - { pkg: "mvdan.cc/sh/v3/cmd/shfmt@latest", bin: shfmt }
      when: have.go and go_ok | bool
      tags: [go, ale]

    - name: Install NATS tools
      ansible.builtin.command: go install {{ item.pkg }}
      args:
        creates: "{{ home_dir }}/go/bin/{{ item.bin }}"
      loop:
        - { pkg: "github.com/nats-io/natscli/nats@latest", bin: nats }
        - { pkg: "github.com/nats-io/nats-server/v2@latest", bin: nats-server }
        - { pkg: "github.com/nats-io/nkeys/nk@latest", bin: nk }
      when: have.go and go_ok | bool and install_nats_tools | default(false) | bool
      tags: nats

    - name: Warn when Go is missing or too old
      ansible.builtin.debug:
        msg: >-
          Go {{ go_version.stdout | default('not found') }}: need >= 1.{{ go_min_minor }}
          for gopls/goimports/golangci-lint/shfmt. Upgrade, then re-run with --tags go.
      when: not (have.go and go_ok | bool)
      tags: [go, ale]

    # ------------------------------------------------------------------- npm
    - name: Point npm at a user-writable global prefix when needed
      ansible.builtin.shell: |
        prefix="$(npm config get prefix)"
        if [ ! -w "$prefix" ]; then
          npm config set prefix "$HOME/.local"
          echo "CHANGED prefix -> $HOME/.local (was $prefix)"
        fi
      register: npm_prefix
      changed_when: "'CHANGED' in npm_prefix.stdout"
      when: have.npm
      tags: [npm, ale]

    - name: Install JS/TS formatters, linters and language servers (npm)
      community.general.npm:
        name: "{{ item }}"
        global: true
        state: present
      loop:
        - prettier
        - eslint
        - typescript
        - typescript-language-server
        - pyright
        - bash-language-server
        - yaml-language-server
        - vscode-langservers-extracted
        - jsonlint
        - markdownlint-cli
        - clang-format
      when: have.npm
      tags: [npm, ale]

    # ---------------------------------------------------------------- github
    # Linux installs gh from its package repo via system.yml (needs root).
    - name: Install GitHub CLI and shellcheck (macOS)
      community.general.homebrew:
        name: [gh, shellcheck]
        state: present
      when: ansible_facts['system'] == "Darwin"
      tags: [github, ale]

    # ------------------------------------------------------------- vim/nvim
    # The checkout puts editor configs at ~/vim and ~/nvim; the editors read
    # them from ~/.vim and ~/.config/nvim.
    - name: Create editor directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ home_dir }}/.vim/autoload"
        - "{{ home_dir }}/.config/nvim"
        - "{{ home_dir }}/.local/share/nvim/site/autoload"
      tags: [vim, nvim]

    - name: Link Vim config files into ~/.vim
      ansible.builtin.file:
        src: "{{ item }}"
        dest: "{{ home_dir }}/.vim/{{ item | basename }}"
        state: link
        force: true
      loop: "{{ query('fileglob', home_dir + '/vim/*.vim') }}"
      tags: [vim, nvim]

    - name: Link Neovim init.lua into ~/.config/nvim
      ansible.builtin.file:
        src: "{{ home_dir }}/nvim/init.lua"
        dest: "{{ home_dir }}/.config/nvim/init.lua"
        state: link
        force: true
      tags: nvim

    - name: Download vim-plug for Vim and Neovim
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        dest: "{{ item }}/plug.vim"
        mode: '0644'
        force: false  # downloads only when missing
      loop:
        - "{{ home_dir }}/.vim/autoload"
        - "{{ home_dir }}/.local/share/nvim/site/autoload"
      tags: [vim, nvim]

    # Both editors share ~/.vim/plugged, so one install covers both. vim-plug
    # clones only missing plugins, so running every pass is cheap.
    - name: Install editor plugins
      ansible.builtin.command: >-
        {{ "vim -es -u " + home_dir + "/.vimrc -i NONE -c 'PlugInstall --sync' -c qa"
           if have.vim else "nvim --headless -c 'PlugInstall --sync' -c 'qa!'" }}
      register: plug_install
      changed_when: "'Cloning' in (plug_install.stdout + plug_install.stderr)"
      failed_when: false
      when: have.vim or have.nvim
      tags: [vim, nvim]

    # coc.nvim ships its prebuilt build/index.js only on the `release` branch;
    # a clone left on master errors on every editor start.
    - name: Check for the prebuilt coc.nvim bundle
      ansible.builtin.stat:
        path: "{{ home_dir }}/.vim/plugged/coc.nvim/build/index.js"
      register: coc_build
      tags: [vim, nvim]

    - name: Put coc.nvim back on its release branch  # noqa: command-instead-of-module
      ansible.builtin.shell: >-
        git fetch origin release:refs/remotes/origin/release &&
        git checkout -B release origin/release
      args:
        chdir: "{{ home_dir }}/.vim/plugged/coc.nvim"
        removes: "{{ home_dir }}/.vim/plugged/coc.nvim/.git"
      changed_when: true
      when: not coc_build.stat.exists
      tags: [vim, nvim]
