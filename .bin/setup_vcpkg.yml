---
# Install vcpkg into ~/.local/vcpkg. ~/.profile adds VCPKG_ROOT and PATH
# whenever that directory exists, so no shell rc edits are needed.
#
#   uvx --from ansible-core ansible-playbook ~/.bin/setup_vcpkg.yml
- name: Setup vcpkg
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    vcpkg_dir: "{{ lookup('env', 'HOME') }}/.local/vcpkg"

  tasks:
    - name: Clone vcpkg
      ansible.builtin.git:
        repo: https://github.com/microsoft/vcpkg.git
        dest: "{{ vcpkg_dir }}"
        version: master
        update: false

    - name: Bootstrap vcpkg
      ansible.builtin.command:
        cmd: ./bootstrap-vcpkg.sh -disableMetrics
        chdir: "{{ vcpkg_dir }}"
        creates: "{{ vcpkg_dir }}/vcpkg"
