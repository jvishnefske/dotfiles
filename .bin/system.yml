---
# Root-level packages. Run with: ~/.bin/install-system.sh
# Everything user-level lives in install.yml, which never needs sudo.
- name: Install system packages
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  tasks:
    - name: Install core packages
      ansible.builtin.package:
        name:
          - git
          - curl
          - vim
          - neovim
          - gcc
          - make
          - golang
          - nodejs
          - npm
        state: present

    - name: Install Debian/Ubuntu packages
      ansible.builtin.apt:
        name: [clangd, clang-format, shellcheck]
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install RHEL/Fedora packages
      ansible.builtin.dnf:
        name: [clang-tools-extra, ShellCheck, dnf-plugins-core]
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    # --- GitHub CLI (from GitHub's own package repo) ---

    - name: Add GitHub CLI signing key (Debian/Ubuntu)
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
        mode: '0644'
      when: ansible_facts['os_family'] == "Debian"

    - name: Add GitHub CLI repository (Debian/Ubuntu)
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}
          signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
          https://cli.github.com/packages stable main
        filename: github-cli
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Add GitHub CLI repository (RHEL/Fedora)
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/rpm/gh-cli.repo
        dest: /etc/yum.repos.d/gh-cli.repo
        mode: '0644'
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install GitHub CLI
      ansible.builtin.package:
        name: gh
        state: present
