[package]
name = "teledildo-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Hardware-independent TCode parser and safety governor for open-source teledildonics devices. no_std, no alloc, no unsafe."
repository = "https://github.com/jvishnefske/dotfiles"
keywords = ["no-std", "embedded", "tcode", "buttplug", "safety"]
categories = ["embedded", "no-std", "no-std::no-alloc"]

[lib]
# Kani harnesses live in src/proofs.rs behind cfg(kani); nothing here needs std.

[dependencies]
# Intentionally empty: every line of logic on the safety path is in this crate.

[dev-dependencies]
proptest = "1.11"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Restriction lints that close off panic paths on the safety-critical code.
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
float_arithmetic = "deny"
as_conversions = "deny"
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow" # "TCode" is a proper noun
